<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720">
  <defs>
    <!-- Definição do degradê -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#313244; stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fundo com degradê -->
  <rect width="1280" height="720" rx="20" fill="url(#bgGradient)"/>

  <!-- Imagem -->
  <image href="https://avatars.githubusercontent.com/u/132499981?v=4" 
         x="20" y="20" height="640" width="640" clip-path="url(#circleClip)" />

  <!-- Textos -->
  <text x="120" y="34" fill="white" font-size="24" font-family="Arial" font-weight="bold">
    Marc (aka Marcello Dev)
  </text>
  <text x="120" y="64" fill="white" font-size="24" font-family="Arial" font-weight="bold">
    Marc, The most creative coder of all time!
  </text>
</svg>
